<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>全球新闻早报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.card{background:#fff;border-radius:20px;padding:48px 36px;text-align:center;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.card h1{font-size:36px;margin-bottom:12px}
.card p{color:#666;font-size:16px;line-height:1.8;margin-bottom:24px}
.card .link{display:inline-block;background:#e74c3c;color:#fff;padding:12px 32px;border-radius:30px;text-decoration:none;font-size:16px;font-weight:600;transition:transform .2s}
.card .link:hover{transform:scale(1.05)}
.card .date{font-size:14px;color:#999;margin-top:20px}
</style>
</head>
<body>
<div class="card">

</div>
</body>
</html>
